# Hearthlens stats pool: a Cloudflare Worker with a D1 database. Deploy steps are in README.md.
name = "hearthlens-pool"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "hearthlens-pool"
database_id = "57bc3bd9-724c-4638-85c4-51c7d3b4d7a7"

# At most 30 submitted games per minute from one address. Cloudflare keeps the counter; nothing is stored here.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }