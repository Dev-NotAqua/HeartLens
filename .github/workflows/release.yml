# Builds every installer and publishes them as a GitHub Release.
# Push a tag like v0.2.0, or run it by hand from the Actions tab with a version number.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and publish (for example 0.2.0)
        required: true
        default: "0.12.2"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  windows-linux:
    name: Windows and Linux installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="$GITHUB_REF_NAME"; else v="$INPUT_VERSION"; fi
          v="${v#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::The version must look like 0.2.0 (got '$v')"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis rpm zip
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool
      - name: Tests
        run: dotnet test tests/Hearthlens.Tests/Hearthlens.Tests.csproj
      - name: Windows setup wizard and preview
        run: installer/windows/build.sh "${{ steps.v.outputs.version }}"
      - name: Linux x64 packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: installer/linux/build.sh "${{ steps.v.outputs.version }}" x64
      - name: Linux arm64 packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: installer/linux/build.sh "${{ steps.v.outputs.version }}" arm64
      # The build scripts skip a format they cannot make (useful locally); a release must not.
      - name: Check every installer was built
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          for f in "Hearthlens-Setup-$V-win-x64.exe" "Hearthlens-Portable-$V-win-x64.zip" "Hearthlens-Preview-$V-win-x64.zip" \
                   "hearthlens_${V}_amd64.deb" "hearthlens_${V}_arm64.deb" \
                   "hearthlens-$V-1.x86_64.rpm" "hearthlens-$V-1.aarch64.rpm" \
                   "Hearthlens-$V-linux-x64.tar.gz" "Hearthlens-$V-linux-arm64.tar.gz" \
                   "Hearthlens-Portable-$V-linux-x64.tar.gz" "Hearthlens-Portable-$V-linux-arm64.tar.gz" \
                   "Hearthlens-$V-linux-x64.AppImage"; do
            test -s "dist/$f" || { echo "::error::dist/$f was not built"; exit 1; }
          done
      # The setup wizard built here is the NSIS fallback; the released one comes from the windows-setup job.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-linux
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.AppImage

  windows-setup:
    name: Windows setup wizard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="$GITHUB_REF_NAME"; else v="$INPUT_VERSION"; fi
          v="${v#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::The version must look like 0.2.0 (got '$v')"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # The setup wizard is a WPF app, so it is published here rather than in the Linux job.
      - name: Hearthlens setup wizard
        shell: pwsh
        run: ./installer/windows/build.ps1 -Version "${{ steps.v.outputs.version }}"
      - name: Check the setup wizard was built
        shell: bash
        env:
          V: ${{ steps.v.outputs.version }}
        run: test -s "dist/Hearthlens-Setup-$V-win-x64.exe" || { echo "::error::dist/Hearthlens-Setup-$V-win-x64.exe was not built"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          if-no-files-found: error
          path: dist/Hearthlens-Setup-*-win-x64.exe

  macos:
    name: macOS installers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="$GITHUB_REF_NAME"; else v="$INPUT_VERSION"; fi
          v="${v#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::The version must look like 0.2.0 (got '$v')"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Apple silicon and Intel (.dmg, .pkg, .zip)
        run: installer/macos/build.sh "${{ steps.v.outputs.version }}" arm64 x64
      - name: Check every installer was built
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          for arch in arm64 x64; do
            for ext in pkg dmg zip; do
              f="Hearthlens-$V-macOS-$arch.$ext"
              test -s "dist/$f" || { echo "::error::dist/$f was not built"; exit 1; }
            done
            test -s "dist/Hearthlens-Portable-$V-macOS-$arch.zip" || { echo "::error::macOS $arch portable zip was not built"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.pkg
            dist/*.zip

  release:
    name: Publish the release
    needs: [windows-linux, windows-setup, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="$GITHUB_REF_NAME"; else v="$INPUT_VERSION"; fi
          v="${v#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::The version must look like 0.2.0 (got '$v')"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check every installer arrived
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          for f in "Hearthlens-Setup-$V-win-x64.exe" "Hearthlens-Portable-$V-win-x64.zip" "Hearthlens-Preview-$V-win-x64.zip" \
                   "hearthlens_${V}_amd64.deb" "hearthlens_${V}_arm64.deb" \
                   "hearthlens-$V-1.x86_64.rpm" "hearthlens-$V-1.aarch64.rpm" \
                   "Hearthlens-$V-linux-x64.tar.gz" "Hearthlens-$V-linux-arm64.tar.gz" \
                   "Hearthlens-Portable-$V-linux-x64.tar.gz" "Hearthlens-Portable-$V-linux-arm64.tar.gz" \
                   "Hearthlens-$V-linux-x64.AppImage" \
                   "Hearthlens-$V-macOS-arm64.pkg" "Hearthlens-$V-macOS-x64.pkg" \
                   "Hearthlens-$V-macOS-arm64.dmg" "Hearthlens-$V-macOS-x64.dmg" \
                   "Hearthlens-$V-macOS-arm64.zip" "Hearthlens-$V-macOS-x64.zip" \
                   "Hearthlens-Portable-$V-macOS-arm64.zip" "Hearthlens-Portable-$V-macOS-x64.zip"; do
            test -s "dist/$f" || { echo "::error::dist/$f is missing from the release"; exit 1; }
          done
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Hearthlens ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: installer/RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
